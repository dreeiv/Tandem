<h1>Mis tareas</h1>

<p>Bienvenido a mi gestor de tareas.</p>

// Componente de formulario para agregar tareas
<app-formulario-tarea
  (agregar)="agregarTarea($event)"
></app-formulario-tarea>

// Componente de lista de tareas
<app-lista-tareas
  [tareas]="tareaService.tareas()"
  (eliminar)="eliminarTarea($event)"
  (cambiarEstado)="cambiarEstado($event)"
></app-lista-tareas>

<!-- Practicando Signals -->
<h2>Practicando Signals</h2>

<p>Contador: {{ contador() }}</p>

<button (click)="incrementarContador()">
  Incrementar
</button>

// Componente de estadísticas de tareas
<app-estadisticas-tareas
  [completadas]="tareaService.tareasCompletadas()"
  [pendientes]="tareaService.tareasPendientes()"
></app-estadisticas-tareas>
